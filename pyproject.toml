[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchawq"
version = "0.1.0"
description = "Clean research codebase for SketchAWQ post-training quantization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.30",
  "datasets>=2.18",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "torch>=2.2",
  "tqdm>=4.66",
  "transformers>=4.51.0",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]
plots = ["matplotlib>=3.8"]
baselines = [
  "autoawq>=0.2.9",
  "gptqmodel>=7.0.0",
  "hqq>=0.2.8",
  "torchvision",
]
llmcompressor-awq = ["llmcompressor>=0.10,<0.11"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
sketchawq = "sketchawq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
