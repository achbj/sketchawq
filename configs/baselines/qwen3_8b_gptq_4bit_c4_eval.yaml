method:
  name: gptq
  label: GPTQModel-GPTQ
  calibration_batch_size: 1
  adapter_kwargs:
    damp_percent: 0.01
    desc_act: true
    true_sequential: true

model:
  repo_id: Qwen/Qwen3-8B
  dtype: float16
  trust_remote_code: false
  local_files_only: false

quantization:
  bits: 4
  group_size: 128
  symmetric: true

calibration:
  source: dataset
  dataset_name: allenai/c4
  dataset_config: en
  split: train
  text_column: text
  num_samples: 256
  sequence_length: 2048
  seed: 42
  packing: true

evaluation:
  enabled: true
  compare_original: true
  benchmark_name: c4_validation_packed_eval2048
  use_calibration_data: false
  source: dataset
  dataset_name: allenai/c4
  dataset_config: en
  split: validation
  text_column: text
  num_samples: 64
  sequence_length: 2048
  packing: true
  max_batches: 64
  measure_throughput: true

output:
  run_name: qwen3_8b_gptq_4bit_c4_eval2048
  output_dir: artifacts
  save_model: false

runtime:
  device: auto
  seed: 42
  log_level: INFO
