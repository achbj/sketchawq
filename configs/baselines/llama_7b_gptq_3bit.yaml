method:
  name: gptq
  label: GPTQModel-GPTQ
  calibration_batch_size: 1
  adapter_kwargs:
    damp_percent: 0.01
    desc_act: true
    true_sequential: true

model:
  repo_id: meta-llama/Llama-2-7b-hf
  dtype: bfloat16
  trust_remote_code: false
  local_files_only: false

quantization:
  bits: 3
  group_size: 32
  symmetric: true

calibration:
  source: dataset
  dataset_name: allenai/c4
  dataset_config: en
  split: train
  text_column: text
  num_samples: 256
  sequence_length: 2048
  seed: 42
  packing: true

evaluation:
  enabled: true
  compare_original: true
  benchmark_name: wikitext2_validation_packed_eval2048
  use_calibration_data: false
  source: dataset
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  split: validation
  text_column: text
  num_samples: null
  sequence_length: 2048
  packing: true
  max_batches: null
  measure_throughput: true

output:
  run_name: llama_7b_gptq_3bit_c4_calib_packed_eval2048
  output_dir: artifacts
  save_model: false

runtime:
  device: auto
  seed: 42
  log_level: INFO
