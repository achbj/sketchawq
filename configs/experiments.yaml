targets:
  smoke:
    description: Fast local sanity check on tiny-gpt2.
    runner: sketchawq
    configs:
      - configs/smoke/tiny.yaml

  smoke-qwen:
    description: Small Qwen2.5 1.5B 3-bit and 4-bit smoke configs.
    runner: sketchawq
    configs:
      - configs/smoke/qwen2_5_1_5b_3bit.yaml
      - configs/smoke/qwen2_5_1_5b_4bit.yaml

  paper-qwen2:
    description: Canonical Qwen2.5 1.5B SketchAWQ 3-bit and 4-bit rows.
    runner: sketchawq
    configs:
      - configs/paper/qwen2_5_1_5b_3bit.yaml
      - configs/paper/qwen2_5_1_5b_4bit.yaml

  paper-qwen3-4b:
    description: Canonical Qwen3 4B SketchAWQ rows.
    runner: sketchawq
    configs:
      - configs/paper/qwen3_4b_3bit.yaml
      - configs/paper/qwen3_4b_4bit.yaml

  paper-qwen3-8b:
    description: Canonical Qwen3 8B SketchAWQ rows.
    runner: sketchawq
    configs:
      - configs/paper/qwen3_8b_3bit.yaml
      - configs/paper/qwen3_8b_4bit.yaml

  paper-qwen3-14b:
