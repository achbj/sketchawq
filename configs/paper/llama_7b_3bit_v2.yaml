# SketchAWQ — LLaMA-2 7B 3-bit v2 (fair GPTQ comparison)
#
# Fair comparison contract (matches llama_7b_gptq_3bit.yaml):
#   group_size : 32        (same as GPTQ baseline)
#   calibration: WikiText2 train, 32 samples, seq 1024, packed, seed 42
#   evaluation : WikiText2 validation, seq 2048, packed, full set
#   dtype      : bfloat16
#
# Key improvements over the old llama_7b_3bit.yaml:
#   - search_objective: hybrid  (old used weighted_error only)
#   - output_error_rows: 64     (old had 0)
#   - output_error_weight: 1.0  (balanced with Hessian term)
#   - sketch rank raised 8 → 32 (old rank-8 very thin for 4096-wide layers)
#   - normalize_error_terms: true (was false — now consistent)
#   - clip grid: kept similar to old but widened slightly around proven range
#   - outlier fraction kept at 0.020 (same as old llama_7b_3bit — proven for LLaMA)

model:
  repo_id: meta-llama/Llama-2-7b-hf
  dtype: bfloat16
  trust_remote_code: false
  local_files_only: false

quantization:
  bits: 3
  group_size: 32            # matches GPTQ baseline
  symmetric: true
  scale_clip_search: greedy
  search_objective: hybrid
  output_error_rows: 64
  output_error_weight: 1.0
  hessian_error_weight: 1.0
  awq_scale_normalization: geometric_mean
  awq_min_scale: 0.125
  awq_max_scale: 8.0
  awq_alpha_candidates: [0.0, 0.125, 0.25, 0.5, 0.75, 1.0]
  clip_candidates: [0.84, 0.83, 0.82, 0.81, 0.80, 0.79, 0.78]

outliers:
  enabled: true
  strategy: protect
  metric: hessian_weight
  fraction: 0.020           # same as proven llama_7b_3bit.yaml
  protected_bits: 16

sketch:
  enabled: true
  mode: diagonal_low_rank
  rank: 32                  # was 8 — now richer for 4096-wide LLaMA layers
  max_rows_per_batch: 128
  diagonal_floor: 0.000001
  low_rank_weight: 0.25
  normalize_error_terms: true  # was false

calibration:
  source: dataset
  dataset_name: wikitext
  dataset_config: wikitext-2-raw-v1
  split: train
  text_column: text
  num_samples: 32           # matches GPTQ baseline (WikiText train)
  sequence_length: 1024     # matches GPTQ baseline
  seed: 42
  packing: true

evaluation:
  enabled: true
  compare_original: true
  benchmark_name: wikitext2_validation_packed_eval2048
  use_calibration_data: false
  source: dataset
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  split: validation
  text_column: text
  num_samples: null
  sequence_length: 2048
  packing: true
  max_batches: null
  measure_throughput: true

output:
  run_name: llama_7b_3bit_v2_fair_g32_hybrid_packed_eval2048
  output_dir: artifacts
  save_model: false

runtime:
  device: auto
  seed: 42
  log_level: INFO
