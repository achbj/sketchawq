model:
  repo_id: meta-llama/Llama-2-7b-hf
  dtype: bfloat16
  trust_remote_code: false
  local_files_only: false

quantization:
  bits: 4
  group_size: 32
  symmetric: true
  scale_clip_search: greedy
  awq_alpha_candidates: [0.0, 0.125, 0.25, 0.5, 0.75, 1.0]
  clip_candidates: [1.0, 0.98, 0.95, 0.9, 0.85]

outliers:
  enabled: true
  strategy: protect
  metric: hessian_weight
  fraction: 0.040
  protected_bits: 16

sketch:
  enabled: true
  mode: diagonal_low_rank
  rank: 8
  max_rows_per_batch: 128
  diagonal_floor: 0.000001
  low_rank_weight: 0.15
  normalize_error_terms: false

calibration:
  source: dataset
  dataset_name: wikitext
  dataset_config: wikitext-2-raw-v1
  split: train
  text_column: text
  num_samples: 32
  sequence_length: 1024
  seed: 42
  packing: true

evaluation:
  enabled: true
  compare_original: true
  benchmark_name: wikitext2_validation_packed_eval2048
  use_calibration_data: false
  source: dataset
  dataset_name: wikitext
  dataset_config: wikitext-2-raw-v1
  split: validation
  text_column: text
  num_samples: null
  sequence_length: 2048
  packing: true
  max_batches: null
  measure_throughput: true

output:
  run_name: llama_7b_4bit_outlier_protect_f040_packed_calib_packed_eval2048
  output_dir: artifacts
  save_model: false

runtime:
  device: auto
  seed: 42
  log_level: INFO
