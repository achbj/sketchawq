model:
  repo_id: meta-llama/Llama-2-7b-hf
  dtype: bfloat16
  trust_remote_code: false
  local_files_only: false

quantization:
  bits: 2
  group_size: 32
  symmetric: true
  scale_clip_search: greedy
  search_objective: weighted_error
  awq_scale_normalization: geometric_mean
  awq_min_scale: 0.25
  awq_max_scale: 4.0
  awq_alpha_candidates: [0.0, 0.125, 0.25, 0.5, 0.75, 1.0]
  clip_candidates: [0.84, 0.83, 0.82, 0.81, 0.80, 0.79, 0.78]

outliers:
  enabled: true
  strategy: protect
  metric: hessian_weight
  fraction: 0.020
  protected_bits: 16

sketch:
  enabled: true
  mode: diagonal_low_rank
  rank: 8
  max_rows_per_batch: 128
  diagonal_floor: 0.000001
  low_rank_weight: 0.25
  normalize_error_terms: false

calibration:
  source: dataset
  dataset_name: allenai/c4
  dataset_config: en
  split: train
  text_column: text
  num_samples: 256
  sequence_length: 2048
  seed: 42
  packing: true

evaluation:
  enabled: true
  compare_original: true
  benchmark_name: wikitext2_validation_packed_eval2048
  use_calibration_data: false
  source: dataset
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  split: validation
  text_column: text
  num_samples: null
  sequence_length: 2048
  packing: true
  max_batches: null
  measure_throughput: true

output:
  run_name: llama_7b_2bit_f020_clip_refine_c085_packed_calib_packed_eval2048
  output_dir: artifacts
  save_model: false

runtime:
  device: auto
  seed: 42
  log_level: INFO
