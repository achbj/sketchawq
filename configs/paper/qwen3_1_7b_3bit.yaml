model:
  repo_id: Qwen/Qwen3-1.7B-Base
  dtype: float16
  trust_remote_code: false
  local_files_only: false

quantization:
  bits: 3
  group_size: 64
  symmetric: true
  scale_clip_search: greedy
  search_objective: hybrid
  output_error_rows: 64
  output_error_weight: 1.0
  hessian_error_weight: 1.0
  awq_scale_normalization: geometric_mean
  awq_min_scale: 0.125
  awq_max_scale: 8.0
  awq_alpha_candidates: [0.0, 0.125, 0.25, 0.5]
  clip_candidates: [0.82, 0.8]

outliers:
  enabled: true
  strategy: protect
  metric: hessian_weight
  fraction: 0.040
  protected_bits: 16

sketch:
  enabled: true
  mode: diagonal_low_rank
  rank: 32
  max_rows_per_batch: 128
  diagonal_floor: 0.000001
  low_rank_weight: 0.25
  normalize_error_terms: true

calibration:
  source: dataset
  dataset_name: allenai/c4
  dataset_config: en
  split: train
  text_column: text
  num_samples: 256
  sequence_length: 1024
  seed: 42
  packing: true

evaluation:
  enabled: true
  compare_original: true
  benchmark_name: wikitext2_validation_packed_eval1024
  use_calibration_data: false
  source: dataset
  dataset_name: wikitext
  dataset_config: wikitext-2-raw-v1
  split: validation
  text_column: text
  num_samples: 256
  sequence_length: 1024
  packing: true
  max_batches: 256
  measure_throughput: true

output:
  run_name: qwen3_1_7b_3bit_qwen_check_packed_eval1024
  output_dir: artifacts
  save_model: false

runtime:
  device: auto
  seed: 42
  log_level: INFO
